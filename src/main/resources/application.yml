# =========================
# Spring 기본 서버 설정
# =========================
# 필요하면 포트 지정해서 쓰면 됨. (미지정 시 기본 8080)
# server:
#   port: 8080

app:
  server-name: kakao-mcp
  server-version: 1.0.0

  temp-dir: ${java.io.tmpdir}/mcp-docs
  temp-ttl-minutes: 30

  mcp:
    http:
      timeout-ms: 4000
    sse:
      timeout-ms: 4000
    health:
      timeout-ms: 30000

  # ✅ McpToolProperties는 app.sse.* 를 사용 (Streamable HTTP(SSE) 응답 유지)
  sse:
    timeout-ms: 4000

  download:
    connect-timeout-ms: 10000
    # URL fetch + 본문 정리 + LLM 요약까지 고려해서 넉넉하게
    read-timeout-ms: 600000
    max-bytes: 10485760
    user-agent: "Mozilla/5.0 (kakao-mcp)"

  # ✅ URL 본문 텍스트 추출 상한/문단 정책 (DocFacade.fetchUrlAsText에서 사용)
  # - 위키 같은 긴 페이지도 빠르게 abstract를 받기 위해 상한을 낮게 유지
  # - final은 DocFacade에서 mode별 상한(abstract 12k / final 18k)으로 한 번 더 캡
  url:
    max-url-chars: 18000
    max-paras: 80
    min-paragraph-chars: 40

  summarize:
    url:
      max-chars: 80000
      min-chars: 900
      max-chunks: 18
    ollama:
      base-url: http://localhost:11434
      model: qwen2.5:7b
      temperature: 0.2
      top-p: 0.9
      num-ctx: 8192
      timeout-ms: 600000

    # ✅ mode를 안 주는 호출(예: URL/FILE에서 mode 누락)일 때 자동 final 승격
    auto-final:
      enabled: true
      threshold-chars: 12000

    # ✅ 입력 길이에 따라 핵심 bullet 개수를 자동 증가
    auto-bullets:
      tier1-max-chars: 1200
      tier2-max-chars: 2500
      tier3-max-chars: 4500
      tier4-max-chars: 8000
      tier5-max-chars: 14000
      # ✅ 5~20개 범위 (길수록 증가)
      tier1: 5
      tier2: 6
      tier3: 8
      tier4: 12
      tier5: 18
      # final이면 조금 더 많게 (최대 20)
      final-extra: 2
      # chunk 요약은 너무 길어지지 않게
      chunk-cap: 10

  prompt:
    common-rules: >
      출력에는 "요약 결과"만 작성한다.
      반드시 한국어(한글)로만 출력한다. 한자(漢字)/중국어/일본어 문자는 한 글자도 출력하지 않는다.
      프롬프트/지시문/마커/참고/입력길이/규칙/포맷 설명 문구는 절대 출력하지 않는다.
      근거는 본문 내용만 사용하고, 모르는 내용은 "알 수 없음"으로 쓴다.
      중복 없이 간결하게 쓴다.

    template:
      abstract-template: |
        [[KAKAO_MCP_PROMPT_V2]]
        {{SOURCE_HINT}}
        아래 본문을 요약하라.

        - 한 줄 요약: 1줄
        - 핵심(정확히 {{POINTS}}개):
          - (총 {{POINTS}}개가 되도록. 더 늘리거나 줄이면 안 됨)

        [본문]
        {{TEXT}}

      final-template: |
        [[KAKAO_MCP_PROMPT_V2]]
        {{SOURCE_HINT}}
        아래 본문을 자세히 요약하라.

        - 한 줄 요약: 1줄
        - 핵심(정확히 {{POINTS}}개):
          - (총 {{POINTS}}개가 되도록. 더 늘리거나 줄이면 안 됨)

        [본문]
        {{TEXT}}

# =========================
# ✅ 해결책 B: Spring이 Node MCP를 stdio로 직접 실행하도록 설정
# (현재 에러: mcp.args 비어있음 -> 여기 추가하면 부팅 성공)
# =========================
mcp:
  # Node MCP/LLM 처리가 길어질 수 있어 타임아웃을 넉넉하게
  request-timeout-seconds: 600

  # ✅ node 실행 커맨드
  command: node

  # ✅ nodeMcp 폴더 경로 (네 서버 기준 /opt/kakaoMcp/nodeMcp)
  #    만약 다른 위치면 여기만 바꾸면 됨
  workdir: /opt/kakaoMcp/nodeMcp

  # ✅ mcp.args 필수 (비어있으면 IllegalStateException으로 부팅 실패)
  args:
    - index.js

  # ✅ node 프로세스 환경변수 (필요하면 추가)
  env:
    OLLAMA_TIMEOUT_MS: "600000"
    OLLAMA_BASE: "http://127.0.0.1:11434"
    OLLAMA_MODEL: "qwen2.5:7b"
    MCP_FORBID_EXTRA_SECTIONS: "true"
