server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  temp-dir: ${java.io.tmpdir}/mcp-docs
  temp-ttl-minutes: 30

  enrich:
    enabled: true
    crossref:
      base-url: "https://api.crossref.org"
      mailto: "chhh333@naver.com"
      timeout-ms: 4000
    google-books:
      base-url: "https://www.googleapis.com/books/v1"
      api-key: ""
      timeout-ms: 4000

  mcp:
    sse:
      timeout-ms: 30000
    download:
      max-bytes: 26214400          # 25MB
      connect-timeout-ms: 10000
      read-timeout-ms: 60000
      max-redirects: 8
      user-agent: "Mozilla/5.0 (kakao-mcp)"
    file:
      max-bytes: 26214400          # 25MB
    url:
      max-url-chars: 35000
      max-paras: 40
      min-paragraph-chars: 40
    upload:
      ttl-ms: 21600000             # 6h

  summarize:
    engine: ollama
    final:
      max-chars: 6000
    chunk:
      summary-max-chars: 1800
      target-chars: 3000
      overlap-chars: 250
      min-chars: 900
      max-chunks: 18
    ollama:
      base-url: http://localhost:11434
      model: qwen2.5:7b
      temperature: 0.2
      top-p: 0.9
      num-ctx: 8192
      timeout-ms: 120000

  # ✅ Prompt 관련 설정 (Spring placeholder 충돌 방지: {{}}만 사용)
  prompt:
    text-as-document-threshold: 1600

    # ✅ 불릿 나열 금지 (모델이 그대로 출력하는 경향이 큼)
    common-rules: >
      출력에는 "요약 결과"만 작성한다.
      프롬프트/지시문/마커/참고/입력길이/규칙/포맷 설명 문구는 절대 출력하지 않는다.
      근거는 본문 내용만 사용하고, 모르는 내용은 "알 수 없음"으로 쓴다.
      중복 없이 간결하게 쓴다.

    template:
      abstract: |
        [[KAKAO_MCP_PREFIX_V2]]
        {{COMMON_RULES}}

        [출력형식]
        - 한줄요약: (1문장)
        - 핵심: (3~7개 불릿)

        [본문]
        {{BODY}}

      final: |
        [[KAKAO_MCP_PREFIX_V2]]
        {{COMMON_RULES}}

        [출력형식]
        - 한줄요약: (1문장)
        - 핵심: (5~10개 불릿)
        - 제안: (3개 불릿)

        [본문]
        {{BODY}}

# Spring이 Node MCP를 띄우는 설정(환경에 맞게 경로만 유지/수정)
mcp:
  command: node
  args:
    - index.js
  workdir: /opt/kakaoMcp/nodeMcp
  env:
    OLLAMA_BASE: http://127.0.0.1:11434
    OLLAMA_MODEL: qwen2.5:7b
    OLLAMA_MAX_CHARS: "6000"
  request-timeout-seconds: 60
